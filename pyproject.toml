[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "pilotpatch"
version = "0.4.0"
description = "A local, Microsoft Copilot-only coding harness for Windows"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "pydantic>=2.10,<3", "playwright>=1.64.1,<2", "rich>=13.9,<15",
  "pathspec>=0.12,<1", "filelock>=4.2.9,<5", "PyYAML>=6.0.2,<7",
  "cryptography>=50.0.2,<52",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "build>=1.2,<2", "pip-audit>=2.9,<3"]

[project.scripts]
pilotpatch = "pilotpatch.cli:main"
copilot-agent = "pilotpatch.cli:main"

[project.urls]
Repository = "https://github.com/Dinesh-Das/PilotPatch"
Documentation = "https://github.com/Dinesh-Das/PilotPatch/blob/main/setup.md"
Issues = "https://github.com/Dinesh-Das/PilotPatch/issues"

[tool.hatch.build.targets.sdist]
include = [
  "/pilotpatch/**/*.py", "/editors/edge", "/editors/vscode", "/tests", "/docs", "/examples",
  "/scripts/build.py", "/build.cmd", "/setup-windows.ps1", "/copilot.cmd", "/copilot-agent.cmd",
  "/setup.md", "/requirements.txt", "/config.example.yaml", "/AGENTS.md", "/CHANGELOG.md",
  "/CONTRIBUTING.md",
]
exclude = ["/editors/**/node_modules", "**/edge-pairing.json", "**/editor-backend.json"]

[tool.hatch.build.targets.wheel]
packages = ["pilotpatch"]

[tool.hatch.build.targets.wheel.force-include]
"editors/edge/background.js" = "pilotpatch/edge_extension/background.js"
"editors/edge/connection.js" = "pilotpatch/edge_extension/connection.js"
"editors/edge/content.js" = "pilotpatch/edge_extension/content.js"
"editors/edge/manifest.json" = "pilotpatch/edge_extension/manifest.json"
"editors/edge/mode.js" = "pilotpatch/edge_extension/mode.js"
"editors/edge/popup.css" = "pilotpatch/edge_extension/popup.css"
"editors/edge/popup.html" = "pilotpatch/edge_extension/popup.html"
"editors/edge/popup.js" = "pilotpatch/edge_extension/popup.js"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: requires explicit authorization and a signed-in Microsoft account", "browser: local Edge fixture tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
