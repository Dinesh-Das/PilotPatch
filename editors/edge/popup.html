<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PilotPatch</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><h1>PilotPatch</h1><p>Connect this Edge profile to VS Code.</p></header>
  <p id="status" role="status">Checking Edge…</p>
  <section id="pair-step" hidden>
    <label for="pair">Choose pairing file</label>
    <input id="pair" type="file" accept=".json,application/json" aria-describedby="pair-help">
    <p id="pair-help">Copy the pairing file path from <strong>Set up Copilot</strong> in VS Code, then paste it into the file picker.</p>
  </section>
  <section id="tab-step" hidden>
    <p id="tab-help"></p>
    <div id="choose" hidden>
      <label for="tabs">Copilot tab</label>
      <select id="tabs"></select>
    </div>
    <a id="open" class="primary" href="https://copilot.com/chat" target="_blank" rel="noopener" hidden>Open Copilot</a>
    <button id="connect" class="primary" type="button" hidden>Use this tab</button>
  </section>
  <p id="error" role="alert"></p>
  <button id="disconnect" type="button" hidden>Disconnect this profile</button>
  <script src="connection.js"></script><script src="popup.js"></script>
</body></html>
